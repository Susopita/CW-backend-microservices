service: delivery-ms

# ==========================================================
# 1. CUSTOM CONFIG
# ==========================================================
custom:
  common: ${file(../../shared/common.yml)}

  dotenv:
    path: ../../.env
    logging: true
    required:
      env:
        - SENDGRID_API_KEY
        - FROM_EMAIL

  esbuild: ${self:custom.common.custom.esbuild}

  # Recursos compartidos
  UsuariosTableName: ${self:custom.common.provider.environment.USERS_TABLE}
  PedidosTableName: ${self:custom.common.provider.environment.PEDIDOS_TABLE}
  EventBusName: ${self:custom.common.provider.environment.EVENT_BUS_NAME}

# ==========================================================
# 2. PLUGINS
# ==========================================================
plugins:
  - serverless-esbuild
  - serverless-step-functions
  - serverless-dotenv-plugin

# ==========================================================
# 3. PROVIDER
# ==========================================================
provider:
  name: ${self:custom.common.provider.name}
  runtime: ${self:custom.common.provider.runtime}
  region: ${self:custom.common.provider.region}
  stage: ${opt:stage, 'dev'}
  memorySize: ${self:custom.common.provider.memorySize}
  timeout: ${self:custom.common.provider.timeout}

  iam: ${self:custom.common.provider.iam}

  environment:
    EVENT_BUS_NAME: ${self:custom.EventBusName}
    USUARIOS_TABLE: ${self:custom.UsuariosTableName}
    PEDIDOS_TABLE: ${self:custom.PedidosTableName}
    SENDGRID_API_KEY: ${.env:SENDGRID_API_KEY}
    FROM_EMAIL: ${.env:FROM_EMAIL}
    NODE_OPTIONS: --enable-source-maps

# ==========================================================
# 4. LAMBDAS
# ==========================================================
functions:
  sendEmail:
    handler: src/sendEmail.handler
    description: Envía emails usando SendGrid API
    timeout: 30
    memorySize: 1024

# ==========================================================
# 5. STEP FUNCTION
# ==========================================================
stepFunctions:
  stateMachines:
    DeliveryFlow:
      name: ms-delivery-${self:provider.stage}
      type: EXPRESS
      role: ${self:custom.common.provider.iam.role}
      definition: ${file(delivery.asl.json)}
      loggingConfig:
        level: ALL
        includeExecutionData: true
        destinations:
          - !GetAtt DeliveryLogGroup.Arn
      tracingConfig:
        enabled: true

      # --- NUEVA SECCIÓN DE EVENTOS (Reemplaza a Resources) ---
      events:
        # REGLA 1: Pago Confirmado -> Inicia
        - eventBridge:
            eventBusName: ${self:custom.EventBusName}
            iamRole: ${self:custom.common.provider.iam.role}
            event:
              source: 
                - "app.payment" 
                - "payment.service" 
              detail-type:
                - "PagoConfirmado"

        # REGLA 2: Comida Preparada -> Busca motorizado
        - eventBridge:
            eventBusName: ${self:custom.EventBusName}
            iamRole: ${self:custom.common.provider.iam.role}
            event:
              source: 
                - "app.kitchen"
                - "kitchen.service"
              detail-type:
                - "ComidaPreparada"

        # REGLA 3: Despachado -> Busca repartidor
        - eventBridge:
            eventBusName: ${self:custom.EventBusName}
            iamRole: ${self:custom.common.provider.iam.role}
            event:
              source: 
                - "app.packing"
                - "packing.service"
              detail-type:
                - "Despachado"

        # REGLA 4: Entregado -> Finaliza
        - eventBridge:
            eventBusName: ${self:custom.EventBusName}
            iamRole: ${self:custom.common.provider.iam.role}
            event:
              source: 
                - "app.driver"
                - "driver.service"
              detail-type:
                - "Entregado"

# ==========================================================
# 6. RESOURCES - EventBridge Rules
# ==========================================================
resources:
  Resources:
    DeliveryLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /aws/vendedlogs/states/cw-delivery-ms-${self:provider.stage}
        RetentionInDays: 7

  # ==========================================================
  # OUTPUTS
  # ==========================================================
  Outputs:
    DeliveryStateMachineArn:
      Description: ARN de la Step Function Delivery
      Value: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:ms-delivery-${self:provider.stage}"
      Export:
        Name: ${self:service}-${self:provider.stage}-StateMachineArn

    SendEmailLambdaArn:
      Description: ARN de la Lambda de envío de email
      Value: !GetAtt SendEmailLambdaFunction.Arn
      Export:
        Name: ${self:service}-${self:provider.stage}-SendEmailArn

    EventBusName:
      Description: Nombre del Event Bus
      Value: ${self:custom.EventBusName}
      Export:
        Name: ${self:service}-${self:provider.stage}-EventBusName
